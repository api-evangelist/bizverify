name: BizVerify
description: >-
  BizVerify is a business entity verification (KYB) API built for AI agents as much as for
  developers. It confirms business registrations, status, good standing and available public
  company details across supported US and international jurisdictions, through a REST API and a
  hosted MCP server that exposes the same capability as nine tools. The agent surface is the
  unusual part for a provider this size: alongside the OpenAPI it publishes an llms.txt, a proper
  RFC 9727 API catalog served as application/linkset+json, per-vendor tool manifests at
  /tools/openai.json and /tools/anthropic.json, and an open-source MCP client repository. Access is
  credit-based with a free-tier allowance, and the MCP server answers tools/list without
  credentials.
