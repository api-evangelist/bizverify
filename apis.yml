apis:
- name: BizVerify MCP Server
  description: >-
    Hosted MCP server over Streamable HTTP exposing nine tools — get_config, list_jurisdictions, verify_business,
    search_entities, check_job_status, get_entity, get_entity_history, get_account and purchase_credits.
    Discovery is public: tools/list answers without credentials. An open-source client repository is published
    separately.
