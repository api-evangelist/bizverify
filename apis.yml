x-evidence:
  harvested: '2026-08-02'
  request: api-search/inbox#1
  probes:
    - https://api.bizverify.co/v1/openapi.json -> HTTP 200, OpenAPI 3.0.3, 20 paths / 21 ops
    - https://bizverify.co/llms.txt -> HTTP 200, 5,871 bytes, text/plain
    - https://bizverify.co/.well-known/api-catalog -> HTTP 200, application/linkset+json, 808 bytes
    - https://api.bizverify.co/mcp tools/list -> HTTP 200, 9 tools, no credentials required
    - https://api.bizverify.co/tools/openai.json -> HTTP 200
    - https://api.bizverify.co/tools/anthropic.json -> HTTP 200
    - https://docs.bizverify.co, /privacy, /terms -> HTTP 200
    - https://bizverify.co/this-does-not-exist-xyz789 -> HTTP 404, 0 bytes (no catch-all; the 200s above are real)
  defects_found:
    empty_servers: >-
      The published OpenAPI declares `servers: []`. Nothing in the document says the API is served
      from https://api.bizverify.co, so it is not callable as published. The baseURL recorded here
      comes from the API catalog linkset and from the live host, not from the spec.
    no_schemas: >-
      21 operations and zero `components.schemas`. Request and response bodies are undescribed,
      which is the single largest gap in the contract and the highest-leverage thing to fix.
    user_agent_gate: >-
      https://api.bizverify.co/v1/openapi.json returns HTTP 403 to `Python-urllib/3.14` while
      returning 200 to curl, to an empty user-agent, and to `python-requests/2.32.3`. So the block
      is specific to urllib rather than to automated clients generally — narrower than it first
      appeared, but still enough to silently starve any harvester built on urllib, which would
      record nothing and understate the provider. Harvested here with curl.
  note: >-
    Built from the provider's own published artifacts, all fetched and measured. The MCP property
    is emitted because the server is hosted and answers tools/list unauthenticated — unlike a
    local-stdio install, which is described in prose only. Pricing is credit-based with a free
    tier per the MCP get_config tool, but no machine-readable rate card was found, so plans and
    rate limits are not asserted.
