apis:
  - name: BizVerify API
    description: >-
      REST API for business entity verification. 21 operations across 20 paths covering
      verification submission and job status, entity lookup and history, jurisdiction discovery,
      account and credit management, and access-request auth. OpenAPI 3.0.3. Authenticates with an
      API key in the X-API-Key header or a bearer token.
    humanURL: https://docs.bizverify.co
    baseURL: https://api.bizverify.co
    tags:
